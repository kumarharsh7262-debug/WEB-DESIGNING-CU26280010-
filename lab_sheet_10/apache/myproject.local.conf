# Q19 + Q18: virtual host for http(s)://myproject.local
# Linux (Debian/Ubuntu): copy to /etc/apache2/sites-available/ then  sudo a2ensite myproject.local
# XAMPP/WAMP: include this file from httpd-vhosts.conf and change the paths below.

<VirtualHost *:80>
    ServerName myproject.local
    # Everything on HTTP goes to HTTPS
    Redirect permanent / https://myproject.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName myproject.local
    DocumentRoot "/var/www/myproject/public"       # <- ONLY public/ is exposed

    # ---- TLS (self-signed certificate made by scripts/make_self_signed_cert.sh) ----
    SSLEngine on
    SSLCertificateFile    /etc/ssl/myproject/myproject.local.crt
    SSLCertificateKeyFile /etc/ssl/myproject/myproject.local.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    <Directory "/var/www/myproject/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All              # lets public/.htaccess work
        Require all granted
    </Directory>

    # ---- App environment (Q20: limited DB user, not root) ----
    SetEnv APP_ENV  production
    SetEnv APP_URL  https://myproject.local
    SetEnv DB_HOST  127.0.0.1
    SetEnv DB_NAME  myproject_db
    SetEnv DB_USER  myproject_app
    SetEnv DB_PASS  ChangeMe_Str0ng!Pass
    # SetEnv SMTP_HOST smtp.gmail.com
    # SetEnv SMTP_USER you@gmail.com
    # SetEnv SMTP_PASS your-app-password

    # ---- Q16: never show PHP errors to visitors, log them instead (mod_php) ----
    <IfModule mod_php.c>
        php_admin_flag  display_errors Off
        php_admin_flag  log_errors     On
        php_admin_value error_log      /var/www/myproject/storage/logs/php_error.log
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/myproject_error.log
    CustomLog ${APACHE_LOG_DIR}/myproject_access.log combined
</VirtualHost>
