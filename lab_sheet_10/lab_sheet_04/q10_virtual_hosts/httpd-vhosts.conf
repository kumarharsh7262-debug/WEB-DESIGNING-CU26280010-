# httpd-vhosts.conf  (XAMPP: C:\xampp\apache\conf\extra\httpd-vhosts.conf)
# Adjust DocumentRoot paths to your machine.

# Keep localhost working as the default host
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs"
</VirtualHost>

<VirtualHost *:80>
    ServerName collegeweb.local
    ServerAlias www.collegeweb.local
    DocumentRoot "C:/xampp/htdocs/collegeweb"

    <Directory "C:/xampp/htdocs/collegeweb">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  "logs/collegeweb-error.log"
    CustomLog "logs/collegeweb-access.log" common
</VirtualHost>
