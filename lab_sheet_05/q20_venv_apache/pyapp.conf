# /etc/apache2/sites-available/pyapp.conf – mod_wsgi using a virtualenv
<VirtualHost *:80>
    ServerName pyapp.local

    # Map the interpreter to the venv with python-home
    WSGIDaemonProcess pyapp python-home=/var/www/pyapp/venv python-path=/var/www/pyapp processes=2 threads=15
    WSGIProcessGroup pyapp
    WSGIScriptAlias /pyapp /var/www/pyapp/app.wsgi

    <Directory /var/www/pyapp>
        <Files app.wsgi>
            Require all granted
        </Files>
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/pyapp-error.log
    CustomLog ${APACHE_LOG_DIR}/pyapp-access.log combined
</VirtualHost>
