<!DOCTYPE html>
<html>
<body>
<h3>Calculator</h3>
<input id="a" type="number" placeholder="First number">
<input id="b" type="number" placeholder="Second number">
<br><br>
<button id="add">+</button>
<button id="sub">-</button>
<button id="mul">*</button>
<button id="div">/</button>
<p id="result">Result: </p>

<script>
let a = document.getElementById("a");
let b = document.getElementById("b");
let r = document.getElementById("result");

function calculate(op) {
    let x = Number(a.value);
    let y = Number(b.value);
    let ans;

    if (op == "+") ans = x + y;
    else if (op == "-") ans = x - y;
    else if (op == "*") ans = x * y;
    else if (op == "/")
        ans = y != 0 ? x / y : "Cannot divide by zero";

    r.innerHTML = "Result: " + ans;
}

document.getElementById("add").addEventListener("click", () => calculate("+"));
document.getElementById("sub").addEventListener("click", () => calculate("-"));
document.getElementById("mul").addEventListener("click", () => calculate("*"));
document.getElementById("div").addEventListener("click", () => calculate("/"));
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<h3>Password Validation</h3>

<form onsubmit="return check()">
<input type="password" id="pass" placeholder="Password" required>
<br><br>
<input type="password" id="confirm" placeholder="Confirm Password" required>
<p id="msg"></p>
<button type="submit">Submit</button>
</form>

<script>
let p = document.getElementById("pass");
let c = document.getElementById("confirm");
let msg = document.getElementById("msg");

function validate() {
    if (p.value == c.value) {
        msg.innerHTML = "Passwords match";
    } else {
        msg.innerHTML = "Passwords do not match";
    }
}

p.addEventListener("input", validate);
c.addEventListener("input", validate);

function check() {
    if (p.value != c.value) {
        alert("Passwords do not match!");
        return false;
    }
    alert("Form submitted successfully!");
    return true;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<script>
function counter() {
  let count = 0;

  return {
    increment: function() {
      return ++count;
    },
    decrement: function() {
      return --count;
    }
  };
}

let c = counter();
document.write(c.increment() + "<br>");
document.write(c.increment() + "<br>");
document.write(c.decrement());
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<img id="pic" src="https://placehold.co/200x120?text=Image+1"
width="200">
<br>
<button onclick="prev()">Previous</button>
<button onclick="next()">Next</button>

<script>
let images = [
  "https://placehold.co/200x120?text=Image+1",
  "https://placehold.co/200x120?text=Image+2",
  "https://placehold.co/200x120?text=Image+3"
];
let i = 0;

function next() {
  i = (i + 1) % images.length;
  document.getElementById("pic").src = images[i];
}

function prev() {
  i = (i - 1 + images.length) % images.length;
  document.getElementById("pic").src = images[i];
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<input id="r" type="number" placeholder="Rows">
<input id="c" type="number" placeholder="Columns">
<button onclick="createTable()">Create</button>
<div id="out"></div>

<script>
function createTable() {
  let r = +document.getElementById("r").value;
  let c = +document.getElementById("c").value;
  let s = "<table border='1'>";

  for (let i = 1; i <= r; i++) {
    s += "<tr>";
    for (let j = 1; j <= c; j++)
      s += "<td>Cell</td>";
    s += "</tr>";
  }

  document.getElementById("out").innerHTML = s + "</table>";
}
</script>
</body>
</html>
